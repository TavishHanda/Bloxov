# Fly.io settings for the game server (see Dockerfile). Deployed by CI; the app name is also the address:
# wss://bloxov-server.fly.dev
app = "bloxov-server"
primary_region = "iad"

[build]

[http_service]
  internal_port = 9080
  force_https = true
  # Sleeps when nobody is connected (costs almost nothing) and wakes up when someone joins.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 25

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
