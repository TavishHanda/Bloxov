name: Server nightly

# Once a night: if the game server is behind main (game changes that didn't raise the net version, so they weren't
# deployed right away), start the normal Web build, which tests and then deploys web and the server. If the server is
# up to date, restart the dyno so Heroku's daily restart happens in the quiet hours instead of mid-evening.
# Quiet window: 08:00-12:59 UTC = 1 am to 6 am Mountain Standard Time (2-7 am in summer time).
# GitHub starts scheduled runs hours late (the 11:00 UTC run of 2026-11-15 started at 17:33), so there are five cron
# lines, at 7 past each hour 08-12 UTC (not on the hour, when GitHub is busiest), hoping one starts in the window.
# tools/nightly_guard.sh decides for scheduled runs: a run that starts outside the window is skipped (never restart
# in the daytime, it ends raids), and so is one that finds the web dyno already started in the last 6 hours (the
# five lines would otherwise restart it five times). A manual run (Run workflow) always acts.
# To change the window: edit the cron hours below and the 8 / 12 in tools/nightly_guard.sh together.
on:
  schedule:
    - cron: "7 8 * * *"
    - cron: "7 9 * * *"
    - cron: "7 10 * * *"
    - cron: "7 11 * * *"
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      APP: bloxov-server
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: No Heroku key
        if: env.HEROKU_API_KEY == ''
        run: echo "::notice::No HEROKU_API_KEY secret, nothing to do."
      - uses: actions/checkout@v5
        if: env.HEROKU_API_KEY != ''
        with:
          ref: main
          fetch-depth: 0
      - name: Quiet window and once-a-night check
        id: guard
        if: env.HEROKU_API_KEY != ''
        run: echo "act=$(bash tools/nightly_guard.sh '${{ github.event_name }}')" >> "$GITHUB_OUTPUT"
      - name: Catch the server up, or restart it
        if: env.HEROKU_API_KEY != '' && steps.guard.outputs.act == 'run'
        run: |
          KEY=$(printf '%s' "$HEROKU_API_KEY" | tr -d '[:space:]')
          deployed=$(git ls-remote "https://heroku:$KEY@git.heroku.com/$APP.git" refs/heads/main 2>/dev/null | cut -f1) || deployed=""
          echo "Deployed commit: ${deployed:-unknown}"
          result=$(bash tools/server_deploy_check.sh "$deployed" "$(git rev-parse HEAD)" schedule)
          echo "Result: $result"
          if [ "$result" = "none" ]; then
            curl -fsS -X DELETE -H "Authorization: Bearer $KEY" -H "Accept: application/vnd.heroku+json; version=3" -H "Content-Type: application/json" "https://api.heroku.com/apps/$APP/dynos"
            echo "Server up to date; dyno restarted."
          else
            # The Web build tests, then deploys web and the server (a manual run always deploys the server).
            gh workflow run web.yml --ref main
            echo "Server behind main; started the Web build."
          fi
