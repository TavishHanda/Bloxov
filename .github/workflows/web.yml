name: Web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} + web export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          tpl_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl_dir"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$tpl_dir/"
          godot --version

      - name: Import project
        run: godot --headless --import 2>&1 | tee import.log

      - name: Gameplay test (shoot, reload, enemy attack, death)
        run: |
          godot --headless -s tests/smoke_test.gd 2>&1 | tee test.log
          grep -q "SMOKE TEST: PASSED" test.log
          if grep -E "SCRIPT ERROR|Parse Error" test.log; then
            echo "::error::Godot reported script errors (see above)"
            exit 1
          fi

      - name: Smoke test (run the main scene for a few seconds)
        run: |
          godot --headless --quit-after 300 2>&1 | tee run.log
          # "still in use at exit" is a harmless shutdown message from force-quitting mid-game.
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log run.log | grep -v "still in use at exit"; then
            echo "::error::Godot reported errors (see above)"
            exit 1
          fi

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          version=$(grep -oP 'config/version="\K[^"]+' project.godot)
          echo "Building v${version}"
          python3 tools/cache_bust.py build/web "${version}-${GITHUB_SHA::8}"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After a successful deploy, tag the commit that set the current version (e.g. v0.2.3).
  tag:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag this version
        run: |
          version=$(grep -oP 'config/version="\K[^"]+' project.godot)
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists"
            exit 0
          fi
          commit=$(git log -1 --format=%H -S"config/version=\"${version}\"" -- project.godot)
          git tag "${tag}" "${commit}"
          git push origin "refs/tags/${tag}"
          echo "Tagged ${tag} at ${commit}"
