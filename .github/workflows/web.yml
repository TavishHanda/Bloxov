name: Web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot ${{ env.GODOT_VERSION }} + web export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          tpl_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl_dir"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$tpl_dir/"
          godot --version

      - name: Import project (fails on any script parse error)
        run: |
          godot --headless --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" import.log; then
            echo "::error::Script errors while importing (see above)"
            exit 1
          fi

      - name: Gameplay test (tests/smoke_test.gd, every section)
        timeout-minutes: 4
        run: |
          # --fixed-fps 60: every frame is exactly 1/60 s of game time (deterministic, and faster than real time).
          godot --headless --fixed-fps 60 -s tests/smoke_test.gd 2>&1 | tee test.log
          grep -q "SMOKE TEST: PASSED" test.log
          # "still in use at exit" is a harmless shutdown message.
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" test.log | grep -v "still in use at exit"; then
            echo "::error::Godot reported errors (see above)"
            exit 1
          fi

      - name: Smoke test (run the main scene, the hideout, for 300 frames)
        timeout-minutes: 2
        run: |
          godot --headless --quit-after 300 2>&1 | tee run.log
          # "still in use at exit" is a harmless shutdown message from force-quitting mid-game.
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log run.log | grep -v "still in use at exit"; then
            echo "::error::Godot reported errors (see above)"
            exit 1
          fi

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          cp -r web/brand build/web/  # link preview picture (og:image in the head include)
          cp web/move_in.js build/web/  # brings saves over from the old site on bloxov.com (see the file)
          version=$(grep -oP 'config/version="\K[^"]+' project.godot)
          echo "Building v${version}"
          python3 tools/cache_bust.py build/web "${version}-${GITHUB_SHA::8}"

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

  # The desktop (Windows) game, for Steam later (owner, 2026-10-25: don't let the Steam build rot). Every update
  # runs the gameplay test on Windows, exports the .exe and starts it. Runs beside the web build and doesn't hold
  # up its deploy; a red X here means the desktop build broke. The .exe is kept for a week (Actions > Artifacts).
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p /c/godot
          unzip -q godot.zip -d /c/godot
          tpl_dir="$APPDATA/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl_dir"
          unzip -q templates.tpz "templates/windows*" "templates/version.txt" -d tpl
          mv tpl/templates/* "$tpl_dir/"
          rm templates.tpz
          echo "GODOT=/c/godot/Godot_v${GODOT_VERSION}-stable_win64_console.exe" >> "$GITHUB_ENV"

      - name: Import project
        run: |
          "$GODOT" --headless --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" import.log; then
            echo "::error::Script errors while importing on Windows (see above)"
            exit 1
          fi

      - name: Gameplay test on Windows (tests/smoke_test.gd)
        timeout-minutes: 6
        run: |
          "$GODOT" --headless --fixed-fps 60 -s tests/smoke_test.gd 2>&1 | tee test.log
          grep -q "SMOKE TEST: PASSED" test.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" test.log | grep -v "still in use at exit"; then
            echo "::error::Godot reported errors on Windows (see above)"
            exit 1
          fi

      - name: Export the Windows game and start it (the hideout, 300 frames)
        timeout-minutes: 4
        run: |
          mkdir -p build/windows
          "$GODOT" --headless --export-release "Windows Desktop" build/windows/Bloxov.exe 2>&1 | tee export.log
          test -f build/windows/Bloxov.exe
          test -f build/windows/Bloxov.pck
          # The console copy of the game prints its log here (the normal .exe has no console window).
          build/windows/Bloxov.console.exe --headless --quit-after 300 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" run.log | grep -v "still in use at exit"; then
            echo "::error::The exported Windows game reported errors (see above)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bloxov-windows
          path: build/windows
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The online game server (Dockerfile + fly.toml), deployed with the same version as the web build so the
  # versions match. Skipped until the FLY_API_TOKEN repository secret exists.
  server:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: No Fly.io token yet
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN isn't set, so the game server wasn't deployed."
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy the game server to Fly.io
        if: env.FLY_API_TOKEN != ''
        run: |
          # First deploy: create the app (fails harmlessly once it exists).
          flyctl apps create bloxov-server --org personal || true
          # One machine only: the raid lives in that one server process.
          flyctl deploy --remote-only --ha=false

  # Same game server on Heroku (GitHub Student Pack credit). Skipped until the HEROKU_API_KEY secret exists
  # AND HEROKU_ON is "true" (owner: switch on only once the student credit shows in Heroku billing).
  heroku:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_ON: "true"
      APP: bloxov-server
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Heroku deploy off
        if: env.HEROKU_API_KEY == '' || env.HEROKU_ON != 'true'
        run: echo "::notice::Heroku deploy is off (needs the HEROKU_API_KEY secret and HEROKU_ON=true)."
      - name: Deploy the game server to Heroku
        if: env.HEROKU_API_KEY != '' && env.HEROKU_ON == 'true'
        run: |
          # A pasted secret can carry a stray space or newline, which breaks the login.
          KEY=$(printf '%s' "$HEROKU_API_KEY" | tr -d '[:space:]')
          api() { curl -fsS -H "Authorization: Bearer $KEY" -H "Accept: application/vnd.heroku+json; version=3" -H "Content-Type: application/json" "$@"; }
          # First deploy: create the app as a Docker ("container") app.
          if ! api https://api.heroku.com/account > /dev/null; then
            echo "::error::Heroku didn't accept HEROKU_API_KEY (401). Copy the API key again from Heroku > Account settings and update the secret."
            exit 1
          fi
          api "https://api.heroku.com/apps/$APP" > /dev/null 2>&1 || api -X POST https://api.heroku.com/apps -d "{\"name\":\"$APP\",\"stack\":\"container\"}"
          # An app made in the dashboard starts on the buildpack stack; this one builds from the Dockerfile.
          api -X PATCH "https://api.heroku.com/apps/$APP" -d '{"build_stack":"container"}' > /dev/null
          git push --force "https://heroku:$KEY@git.heroku.com/$APP.git" HEAD:refs/heads/main
          # One always-on server (Basic): the raid lives in that one process, so never more than one.
          api -X PATCH "https://api.heroku.com/apps/$APP/formation/web" -d '{"quantity":1,"size":"basic"}'
          echo "Server address: $(api https://api.heroku.com/apps/$APP | python3 -c 'import json,sys; print(json.load(sys.stdin)["web_url"])')"
