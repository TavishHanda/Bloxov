name: Backfill version tags (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag versions from before CI tagging existed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r tag commit; do
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
              echo "${tag} already exists"
            else
              sha=$(git rev-parse "${commit}")
              gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}" > /dev/null
              echo "Tagged ${tag} at ${commit}"
            fi
          done <<'TAGS'
          v0.1.0 620c666
          v0.1.1 d8fd76d
          v0.1.2 43c9df1
          v0.2.0 d96eed7
          v0.2.1 50920b9
          v0.2.2 d858abf
          v0.2.3 3f9306c
          TAGS
