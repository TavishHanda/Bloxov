# Heroku settings for the game server (see the Dockerfile). server/start.sh also starts the Stash API when
# Heroku Postgres is attached (DATABASE_URL). Heroku gives the port in $PORT, which the
# server reads when no --port is passed. Deployed by CI (.github/workflows/web.yml, job "heroku").
build:
  docker:
    web: Dockerfile
run:
  web: sh /game/server/start.sh
